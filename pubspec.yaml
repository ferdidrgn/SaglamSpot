name: saglamspot
description: "Sağlam Spot - Modern Mobilya ve Yönetici Paneli Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # --- State Management & Logic ---
  flutter_riverpod: ^3.0.3  # State yönetimi için Riverpod.
  riverpod_annotation: ^3.0.3  # Riverpod için anotasyon desteği.
  equatable: ^2.0.5
  dartz: ^0.10.1 # Functional Programming (Either/Option)
  freezed_annotation: ^3.0.3

  # --- Navigation ---
  go_router: ^14.2.0

  # --- Firebase Ecosystem ---
  firebase_core: ^4.3.0  # Firebase temel yapı.
  firebase_auth:  # Firebase kimlik doğrulama.
  cloud_firestore:   # Firebase'in NoSQL veritabanı.
  firebase_storage:   # Firebase dosya depolama hizmeti.

  # --- Networking & Connectivity ---
  dio: ^5.3.2
  internet_connection_checker: ^3.0.1
  url_launcher: ^6.0.20

  # --- Media & File Handling ---
  image_picker: ^1.0.7  # Mobil kamera/galeri
  file_picker: ^8.1.7   # Web dosya seçimi
  cached_network_image: ^3.3.1
  universal_html: ^2.2.4 # Cross-platform (Web/Mobil) uyumu için
  flutter_web_plugins:  # Web Plugins invisible=> #
    sdk: flutter

  # --- UI Components & Utilities ---
  shimmer: ^3.0.0
  intl: ^0.18.1
  google_maps_flutter: ^2.5.3
  shared_preferences: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # --- Code Generation Tools ---
  build_runner: ^2.4.8
  freezed:
  riverpod_generator: ^3.0.3 # Riverpod için kod üretimi.
  injectable_generator: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/saglam_spot_logo.png
    - assets/images/bicycle_france.jpg
    - assets/images/volvo_transport.jpg
    - assets/images/tram_bus.jpg
    - assets/images/map.jpg
    - assets/images/book_room.jpg
    - assets/images/man_walk.jpg
name: saglamspot
description: "Sağlam Spot - Modern Mobilya ve Yönetici Paneli Uygulaması"
publish_to: 'none'
version: 1.0.0+13

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter

  # Localization (Resmi Paketler)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2 # Yerelleştirme ve tarih formatları için şart
  flutter_web_plugins:
    sdk: flutter

  # State Management & Logic
  equatable:
  dartz:
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Network & Storage
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.2
  connectivity_plus: ^6.0.3
  cached_network_image:

  # Media
  image_picker:

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth:
  cloud_firestore:
  firebase_storage:
  firebase_app_check: ^0.4.1+4
  firebase_crashlytics: ^5.0.6
  firebase_analytics: ^12.1.0
  firebase_messaging: ^16.1.0
  firebase_remote_config: ^6.1.3
  flutter_local_notifications: ^22.3.0
  cloud_functions: ^6.3.6
  app_settings: ^6.1.1
  dynamic_color: ^1.7.0

  # Google Services
  google_mobile_ads:

  # Satın Alma / Abonelik (RevenueCat) — "6 Aylık Reklamsız Üyelik" tek dijital
  # ürünün entitlement/abonelik durumu buradan yönetilir (bkz.
  # core/services/subscription/). Web'de (kIsWeb) kullanılmaz, init() no-op'tur.
  purchases_flutter: ^10.12.0

  app_links: ^6.1.1

  # UI Components
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  url_launcher:
  share_plus: ^12.0.1
  go_router:
  visibility_detector: ^0.4.0+2
  package_info_plus: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Generators
  flutter_lints:
  build_runner: ^2.4.9
  riverpod_generator: ^3.0.3
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  # Kod Üretimini Aktif Et (ARB dosyalarını okuması için şart)
  generate: true

  # saglam_spot_logo_full.png buraya DAHİL DEĞİL: yalnızca aşağıdaki
  # flutter_native_splash yapılandırmasının build-time girdisi, uygulama
  # çalışma zamanında hiçbir Dart kodundan referans alınmıyor — çalışma
  # zamanı asset paketine dahil etmek gereksiz yer kaplıyordu.
  assets:
    - assets/images/saglam_spot_logo_mark.png


# ================================================
# NATIVE SPLASH SCREEN CONFIGURATION
# ================================================
# Renkler AppColors (lib/core/theme/app_colors.dart) ile TEK TEK eşleşir:
#   açık: AppColors.background  -> #F5EFE6
#   koyu: AppColors.darkBackground (= dark modda AppColors.background) -> #1C140E
# Böylece native splash'ten Flutter'ın ilk karesine geçiş renkte SIÇRAMA
# yapmaz (önceki sürümde color_dark yanlışlıkla #241A13 idi — bu, koyu
# temanın gerçek scaffold rengi değil, AppColors.primaryDark/backgroundDark
# gibi FARKLI bir sabitti; buradan düzeltildi).
flutter_native_splash:
  # Android <12 / iOS: tam logo (marka adı dahil) — bu yüzeylerde
  # Android 12'nin aksine görsel boyutu/oranı serbest.
  color: "#F5EFE6"
  image: "assets/images/saglam_spot_logo_full.png"
  color_dark: "#1C140E"
  image_dark: "assets/images/saglam_spot_logo_full.png"

  android_gravity: center
  ios_content_mode: center

  android: true
  ios: true
  web: false

  # CRITICAL REFACTOR: Uçtan uca ekran uyarılarını ezmemek adına false yapıldı.
  # Tam ekran bayrağı (fullscreen: true) Android 15 cihazlarda çakışma hatası üretir.
  fullscreen: false

  # Android 12+ (yeni SplashScreen API): arkaplan + ayrı bir "ikon" katmanı
  # olarak render edilir ve ikonun yalnızca iç 2/3'lük "safe zone"u görünür
  # kalır (kenarlar sistem tarafından maskelenir) — bu yüzden marka adı
  # yazılı tam logo yerine KARE, şeffaf zeminli "mark" (ikon) kullanılıyor;
  # aksi halde kelime/harfler dairesel maskeyle kırpılırdı.
  android_12:
    image: "assets/images/saglam_spot_logo_mark.png"
    color: "#F5EFE6"
    icon_background_color: "#F5EFE6"
    image_dark: "assets/images/saglam_spot_logo_mark.png"
    color_dark: "#1C140E"
    icon_background_color_dark: "#1C140E"
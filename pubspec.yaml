name: saglamspot
description: "Sağlam Spot - Modern Mobilya ve Yönetici Paneli Uygulaması"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter


  # State Management & Logic
  equatable:
  dartz:
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  freezed_annotation:
  json_annotation:


  # Network & Storage
  dio:
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.3
  cached_network_image:

  # Media
  image_picker:
  file_picker:

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth:
  cloud_firestore:
  firebase_storage:
  firebase_app_check:
  firebase_crashlytics: ^5.0.6
  firebase_analytics: ^12.1.0
  firebase_messaging: ^16.1.0

  # Google Services
  google_sign_in: ^5.0.0
  google_maps_flutter:
  google_mobile_ads:

  # UI Components
  permission_handler:
  simple_html_css:
  universal_html: ^2.2.4 # Cross-platform (Web/Mobil) uyumu için
  pinput:
  qr_flutter:
  shimmer: ^3.0.0
  url_launcher:
  share_plus: ^12.0.1
  go_router:
  dynamic_color: ^1.8.1
  visibility_detector: ^0.4.0+2

  # Utils
  intl:
  flutter_web_plugins: # Web Plugins invisible=> #
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  # Generators
  flutter_lints:
  injectable_generator:
  build_runner: ^2.10.4
  freezed:
  riverpod_generator: ^3.0.3
  json_serializable:
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/saglam_spot_logo.png
    - assets/images/bicycle_france.jpg
    - assets/images/volvo_transport.jpg
    - assets/images/tram_bus.jpg
    - assets/images/map.jpg
    - assets/images/book_room.jpg
    - assets/images/man_walk.jpg
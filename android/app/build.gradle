plugins {
    id "com.android.application"
    id "kotlin-android"
    id "com.google.gms.google-services"
    id "com.google.firebase.crashlytics"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.ferdidrgn.saglamspot"
    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    defaultConfig {
        applicationId "com.ferdidrgn.saglamspot"
        minSdkVersion flutter.minSdkVersion
        //minSdk = flutter.minSdkVersion
        // Güvenlik kütüphaneleri ve biyometrik doğrulamalar için minimum 23 (Android 6.0) önerilir
        targetSdk flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        multiDexEnabled true
    }

    signingConfigs {
        release {
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release

            // 🛡️ AŞIRI GÜVENLİK VE ZIRHLAMA AYARLARI
            minifyEnabled true       // Kod obfuscation (kod karartma/anlaşılmazlaştırma) aktif
            shrinkResources true
            // Kullanılmayan tüm kaynakları siler, tersine mühendisliği zorlaştırır
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            debuggable false         // Uygulamanın debug modda çalışmasını kesinlikle engeller

            // NDK Seviyesinde Güvenlik için debug sembollerini ayıklar
            ndk {
                debugSymbolLevel 'SYMBOL_TABLE'
            }

            firebaseCrashlytics {
                mappingFileUploadEnabled true
                nativeSymbolUploadEnabled true
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
        // Derleyici seviyesinde ek güvenlik optimizasyonları
        freeCompilerArgs += ["-Xstdlib-call-evaluation-mode=strict"]
    }
}

flutter {
    source = "../.."
}

dependencies {
    implementation 'com.android.support:multidex:1.0.3'
    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.core:core-ktx:1.13.1"

    // Firebase BoM
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-crashlytics'
}
